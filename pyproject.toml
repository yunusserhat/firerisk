[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "firerisk-bench"
version = "0.1.0"
description = "Reproducible, storage-aware SigLIP2 and vision backbone benchmarks for FireRisk"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "GPL-3.0-only"
dependencies = [
  "torch==2.9.1", "torchvision==0.24.1", "transformers==4.57.6",
  "timm==1.0.22", "peft==0.18.0", "huggingface-hub>=0.34,<1",
  "numpy>=1.26,<3", "scikit-learn>=1.5,<2", "pyarrow>=18,<24",
  "Pillow>=11,<13", "PyYAML>=6,<7", "matplotlib>=3.9,<4", "tqdm>=4.66,<5",
  "filelock>=3.16,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
firerisk = "firerisk.cli:main"

[project.urls]
Repository = "https://github.com/yunusserhat/firerisk"
Documentation = "https://github.com/yunusserhat/firerisk#readme"
Issues = "https://github.com/yunusserhat/firerisk/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/firerisk"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
